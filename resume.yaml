projects:
  - name:      Desired State Configuration (DSC)
    type:      Open source project
    url:       https://learn.microsoft.com/powershell/dsc/overview?view=dsc-3.0&preserveView=true
    sourceUrl: https://github.com/PowerShell/DSC
    startDate: 2023-03
    description: >-
      Maintainer and documentarian for Desired State Configuration (DSC), Microsoft's idempotent
      and declarative configuration management platform. DSC provides a powerful and flexible
      engine for managing the state of computer systems and their components, building a set of
      semantics and contracts that support a rich ecosystem of resources and integrations into any
      existing toolchain.
    roles:
      - Technical writer
      - Maintainer
      - Community liaison
      - Schema owner
    highlights:
      - >-
        Contributed to the design and development of the platform, including writing
        specifications, defining processes, authoring RFCs, and helping to improve the safety,
        ergonomics, and ease of integration for the platform.
      - >-
        Authored and maintained enhanced JSON Schemas for every input and output data type the
        platform accepts or produces, improving the ergonomics and reliability of the data
        contracts.
      - >-
        Refactored and improved the maintenance tools used in local development and continuous
        integration, improving compile and test times by an order of magnitude and improving the
        PR review experience by providing more comprehensive feedback.
      - >-
        Provided technical guidance to customers and partners on: using and integrating with the
        platform; authoring resources, extensions, and configuration documents; adopting DevOps
        and infrastructure as code practices; and troubleshooting and debugging issues with the
        platform and ecosystem components.
    
  - name:      Documentarian
    type:      Open source project
    url:       https://microsoft.github.io/Documentarian/
    sourceUrl: https://github.com/Microsoft/Documentarian
    startDate: 2022-10
    description: >-
      Co-designed and implemented the Documentarian PowerShell modules to improve the experience of
      authoring and maintaining PowerShell documentation.
    roles:
      - Architect
      - Developer
      - Maintainer
      - Documentarian
    highlights:
      - >-
        The Documentarian module provides general commands and helpers for editing and maintaining
        Markdown documents.
      - >-
        The Documentarian.MarkdownBuilder module provides commands and helpers for a specialized
        string builder for Markdown text.
      - >-
        The Documentarian.MicrosoftDocs module provides commands specifically useful to maintainers
        of and contributors to official Microsoft documentation.
      - >-
        The Documentarian.ModuleAuthor module provides commands and helpers for authoring and
        maintaining PowerShell module documentation.

  - name: Puppet.Dsc
    type:      Open source project
    sourceUrl: https://github.com/puppetlabs/Puppet.Dsc
    startDate: 2020-03
    endDate:   2022-02
    description: >-
      Led architecture and development of Puppet.Dsc, seamlessly exposing and integrating
      Microsoft's primary automation framework (DSC) with Puppet, allowing folks familiar with
      either tool to be proficient with both. The judicious use of automation in the project
      improved flexibility and coverage (hundreds of modules and thousands of resources) while
      reducing engineering and customer maintenance costs by orders of magnitude.
    roles:
      - Architect
      - Developer
      - Maintainer
      - Documentarian
